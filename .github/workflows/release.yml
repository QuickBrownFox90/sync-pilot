name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check plugin version matches release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -E '^[[:space:]*]*Version:' sync-pilot.php | sed -E 's/^[[:space:]*]*Version:[[:space:]]*//; s/[[:space:]]+$//')
          meta=$(grep -m1 "\['version'\]" sync-pilot.php | sed -E "s/.*= '([^']+)'.*/\1/")
          echo "tag=$tag header=$header meta=$meta"
          if [ "$tag" != "$header" ] || [ "$tag" != "$meta" ]; then
            echo "::error::Release tag ($tag), plugin header ($header) and syncpilot_meta version ($meta) must be identical"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check that the built assets are up to date
        run: |
          npm ci
          npm run build
          if [ -n "$(git status --porcelain -- asset/css asset/js)" ]; then
            echo "::error::asset/css or asset/js is not up to date, run 'npm run build' and commit the result"
            git status --porcelain -- asset/css asset/js
            exit 1
          fi

      - name: Build plugin ZIP
        run: |
          mkdir -p /tmp/sync-pilot
          rsync -r \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='asset/src' \
            --exclude='tests' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='.editorconfig' \
            --exclude='.gitignore' \
            --exclude='*.md' \
            --exclude='*.txt' \
            ./ /tmp/sync-pilot/sync-pilot/
          cd /tmp/sync-pilot
          zip -r sync-pilot.zip sync-pilot/

      - name: Attach ZIP to release
        uses: softprops/action-gh-release@v3
        with:
          files: /tmp/sync-pilot/sync-pilot.zip
